<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coin & Bomb Catcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 480px;
      height: 640px;
      background: radial-gradient(circle at 50% 20%, #161b22, #0a0d12);
      border: 2px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    /* Top HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 17, 23, 0.75);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #30363d;
      z-index: 10;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #8b949e;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #58a6ff;
    }

    #lives {
      color: #f85149;
      font-size: 18px;
      letter-spacing: 2px;
    }

    /* Canvas */
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Modals / Overlays */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 17, 23, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 20;
      transition: opacity 0.3s ease;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #388bfd;
      text-shadow: 0 0 16px rgba(56, 139, 253, 0.4);
    }

    .overlay p {
      font-size: 14px;
      color: #8b949e;
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
    }

    .score-summary {
      font-size: 18px;
      color: #e6edf3;
      margin: 8px 0;
    }

    .btn {
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: #fff;
      box-shadow: 0 4px 14px rgba(35, 134, 54, 0.4);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn:hover {
      background: linear-gradient(135deg, #2ea043, #3fb950);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .instructions {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 12px;
      color: #c9d1d9;
      text-align: left;
    }

    .instructions span {
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Top HUD -->
    <div id="hud">
      <div class="stat-item">
        <span class="stat-label">Score</span>
        <span id="score-display" class="stat-value">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">High Score</span>
        <span id="high-score-display" class="stat-value">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Lives</span>
        <span id="lives" class="stat-value">❤❤❤</span>
      </div>
    </div>

    <!-- Canvas -->
    <canvas id="gameCanvas" width="480" height="640"></canvas>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
      <h1>CATCHER</h1>
      <p>Catch coins, avoid bombs, and keep your score alive!</p>
      <div class="instructions">
        <span>🪙 <b>Regular Coin:</b> +10 Pts</span>
        <span>⭐ <b>Golden Star:</b> +25 Pts</span>
        <span>💣 <b>Bomb:</b> -15 Pts & -1 Life</span>
        <span>🎮 <b>Controls:</b> Mouse or Left/Right Arrow Keys</span>
      </div>
      <button id="start-btn" class="btn">START GAME</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="overlay hidden">
      <h1 style="color: #f85149; text-shadow: 0 0 16px rgba(248, 81, 73, 0.4);">GAME OVER</h1>
      <div class="score-summary">
        Final Score: <strong id="final-score" style="color: #58a6ff;">0</strong>
      </div>
      <p id="game-over-reason">You ran out of lives!</p>
      <button id="restart-btn" class="btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    // ===================================================
    // GAME CONFIGURATION (Adjust gameplay balance here)
    // ===================================================
    const CONFIG = {
      // Basket dimensions & speed
      paddleWidth: 90,
      paddleHeight: 18,
      paddleSpeed: 8, // Keyboard movement speed

      // Scoring rules
      pointsRegularCoin: 10,
      pointsGoldCoin: 25,
      pointsBombPenalty: 15,
      minAllowedScore: -30, // Game over if score falls below this

      // Starting stats
      startingLives: 3,

      // Initial physics & spawn timing
      initialFallSpeed: 3.2,
      maxFallSpeed: 8.5,
      initialSpawnInterval: 65, // in frames (~60 frames = 1 sec)
      minSpawnInterval: 25,

      // Drop rate weights (must total 100)
      chanceRegularCoin: 60, // 60%
      chanceGoldCoin: 15,    // 15%
      chanceBomb: 25         // 25%
    };

    // ===================================================
    // INITIALIZATION & STATE
    // ===================================================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreDisplay = document.getElementById("score-display");
    const highScoreDisplay = document.getElementById("high-score-display");
    const livesDisplay = document.getElementById("lives");

    const startScreen = document.getElementById("start-screen");
    const gameOverScreen = document.getElementById("game-over-screen");
    const startBtn = document.getElementById("start-btn");
    const restartBtn = document.getElementById("restart-btn");
    const finalScoreDisplay = document.getElementById("final-score");
    const gameOverReason = document.getElementById("game-over-reason");

    let isRunning = false;
    let score = 0;
    let lives = CONFIG.startingLives;
    let highScore = parseInt(localStorage.getItem("catcher_high_score") || "0", 10);
    highScoreDisplay.textContent = highScore;

    let items = [];
    let particles = [];
    let frameCount = 0;

    // Paddle state
    const paddle = {
      x: canvas.width / 2 - CONFIG.paddleWidth / 2,
      y: canvas.height - 42,
      width: CONFIG.paddleWidth,
      height: CONFIG.paddleHeight,
      vx: 0
    };

    // Keyboard controls
    const keys = { ArrowLeft: false, ArrowRight: false };

    // ===================================================
    // EVENT LISTENERS (Controls & Buttons)
    // ===================================================
    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.ArrowLeft = true;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.ArrowRight = true;
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.ArrowLeft = false;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.ArrowRight = false;
    });

    // Mouse movement
    canvas.addEventListener("mousemove", (e) => {
      if (!isRunning) return;
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, mouseX - paddle.width / 2));
    });

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);

    // ===================================================
    // GAME LIFECYCLE
    // ===================================================
    function startGame() {
      score = 0;
      lives = CONFIG.startingLives;
      items = [];
      particles = [];
      frameCount = 0;
      paddle.x = canvas.width / 2 - CONFIG.paddleWidth / 2;

      updateHUD();
      startScreen.classList.add("hidden");
      gameOverScreen.classList.add("hidden");

      isRunning = true;
      requestAnimationFrame(gameLoop);
    }

    function endGame(reasonText) {
      isRunning = false;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("catcher_high_score", highScore);
        highScoreDisplay.textContent = highScore;
      }

      finalScoreDisplay.textContent = score;
      gameOverReason.textContent = reasonText;
      gameOverScreen.classList.remove("hidden");
    }

    function updateHUD() {
      scoreDisplay.textContent = score;
      livesDisplay.textContent = "❤".repeat(Math.max(0, lives));
    }

    // ===================================================
    // SPAWNING & DIFFICULTY PROGRESSION
    // ===================================================
    function spawnItem() {
      // Difficulty scales up with current score
      const difficultyFactor = Math.min(Math.max(score, 0) / 400, 1);
      const currentFallSpeed = CONFIG.initialFallSpeed + difficultyFactor * (CONFIG.maxFallSpeed - CONFIG.initialFallSpeed);

      const rand = Math.random() * 100;
      let type = "coin";

      if (rand < CONFIG.chanceRegularCoin) {
        type = "coin";
      } else if (rand < CONFIG.chanceRegularCoin + CONFIG.chanceGoldCoin) {
        type = "gold";
      } else {
        type = "bomb";
      }

      const radius = type === "gold" ? 14 : 16;
      const x = Math.random() * (canvas.width - radius * 2) + radius;

      items.push({
        x: x,
        y: -20,
        radius: radius,
        speed: currentFallSpeed + (Math.random() * 1.2 - 0.6),
        type: type
      });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 1,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    // ===================================================
    // MAIN LOOP
    // ===================================================
    function gameLoop() {
      if (!isRunning) return;

      update();
      render();

      requestAnimationFrame(gameLoop);
    }

    function update() {
      frameCount++;

      // Keyboard movement
      if (keys.ArrowLeft) paddle.x -= CONFIG.paddleSpeed;
      if (keys.ArrowRight) paddle.x += CONFIG.paddleSpeed;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

      // Dynamic spawn rate based on score
      const difficultyFactor = Math.min(Math.max(score, 0) / 400, 1);
      const currentSpawnInterval = Math.round(
        CONFIG.initialSpawnInterval - difficultyFactor * (CONFIG.initialSpawnInterval - CONFIG.minSpawnInterval)
      );

      if (frameCount % currentSpawnInterval === 0) {
        spawnItem();
      }

      // Update falling items
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed;

        // Paddle Collision detection
        const paddleTop = paddle.y;
        const paddleBottom = paddle.y + paddle.height;
        const paddleLeft = paddle.x;
        const paddleRight = paddle.x + paddle.width;

        const isColliding =
          item.y + item.radius >= paddleTop &&
          item.y - item.radius <= paddleBottom &&
          item.x + item.radius >= paddleLeft &&
          item.x - item.radius <= paddleRight;

        if (isColliding) {
          if (item.type === "coin") {
            score += CONFIG.pointsRegularCoin;
            createExplosion(item.x, item.y, "#e3b341");
          } else if (item.type === "gold") {
            score += CONFIG.pointsGoldCoin;
            createExplosion(item.x, item.y, "#f2cc60");
          } else if (item.type === "bomb") {
            score -= CONFIG.pointsBombPenalty;
            lives -= 1;
            createExplosion(item.x, item.y, "#f85149");
          }

          updateHUD();
          items.splice(i, 1);

          // Check GameOver conditions
          if (lives <= 0) {
            endGame("You ran out of lives!");
            return;
          }
          if (score < CONFIG.minAllowedScore) {
            endGame(`Score dropped below limit (${CONFIG.minAllowedScore})!`);
            return;
          }
          continue;
        }

        // Offscreen removal
        if (item.y - item.radius > canvas.height) {
          items.splice(i, 1);
        }
      }

      // Update explosion particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    // ===================================================
    // DRAWING / RENDERING
    // ===================================================
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw subtle grid lines in background
      ctx.strokeStyle = "rgba(48, 54, 61, 0.25)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      // Draw Paddle
      const paddleGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
      paddleGrad.addColorStop(0, "#58a6ff");
      paddleGrad.addColorStop(1, "#1f6feb");

      ctx.fillStyle = paddleGrad;
      ctx.shadowColor = "rgba(88, 166, 255, 0.4)";
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
      ctx.fill();
      ctx.shadowBlur = 0; // reset shadow

      // Draw Items
      for (const item of items) {
        ctx.save();
        ctx.translate(item.x, item.y);

        if (item.type === "coin") {
          // Regular Bronze/Silver Coin
          ctx.beginPath();
          ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
          ctx.fillStyle = "#e3b341";
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#fff";
          ctx.stroke();

          ctx.fillStyle = "#594308";
          ctx.font = "bold 12px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("¢", 0, 1);

        } else if (item.type === "gold") {
          // Golden Star Coin
          ctx.beginPath();
          ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
          ctx.fillStyle = "#f2cc60";
          ctx.shadowColor = "#f2cc60";
          ctx.shadowBlur = 12;
          ctx.fill();

          ctx.fillStyle = "#0d1117";
          ctx.font = "bold 13px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("★", 0, 1);

        } else if (item.type === "bomb") {
          // Dangerous Bomb
          ctx.beginPath();
          ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
          ctx.fillStyle = "#21262d";
          ctx.strokeStyle = "#f85149";
          ctx.lineWidth = 2;
          ctx.shadowColor = "#f85149";
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.stroke();

          // Skull / Exclamation icon
          ctx.fillStyle = "#f85149";
          ctx.font = "bold 14px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("✕", 0, 1);
        }

        ctx.restore();
      }

      // Draw Particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  </script>
</body>
</html>
